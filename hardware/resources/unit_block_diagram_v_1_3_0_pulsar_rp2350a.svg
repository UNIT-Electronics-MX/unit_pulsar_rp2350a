<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e66a25"/>
    </marker>
    <style>
      .box{fill:#f4f6f8;stroke:#172536;stroke-width:3;rx:16}
      .main{fill:#172536;stroke:#e66a25;stroke-width:5;rx:20}
      .power{fill:#fff1e8;stroke:#e66a25;stroke-width:3;rx:16}
      .title{font:700 28px sans-serif;fill:#172536}
      .label{font:600 21px sans-serif;fill:#172536;text-anchor:middle}
      .small{font:400 17px sans-serif;fill:#596573;text-anchor:middle}
      .white{fill:white}
      .line{stroke:#e66a25;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="white"/>
  <text x="700" y="55" class="title" text-anchor="middle">UNIT PULSAR RP2350 — Functional Block Diagram</text>

  <rect x="510" y="305" width="380" height="235" class="main"/>
  <text x="700" y="375" class="label white">RP2350A</text>
  <text x="700" y="415" class="small white">Dual Cortex-M33 or Hazard3</text>
  <text x="700" y="448" class="small white">520 kB SRAM · USB · ADC · PIO</text>
  <text x="700" y="481" class="small white">I2C · SPI · UART · HSTX</text>

  <rect x="55" y="115" width="300" height="120" class="box"/>
  <text x="205" y="165" class="label">W25Q128 QSPI Flash</text>
  <text x="205" y="200" class="small">128 Mbit / 16 MiB</text>
  <path d="M355 175 H510 V340" class="line"/>

  <rect x="55" y="300" width="300" height="120" class="box"/>
  <text x="205" y="350" class="label">APS6404L PSRAM</text>
  <text x="205" y="385" class="small">8 MiB · CS on GPIO0</text>
  <path d="M355 360 H510" class="line"/>

  <rect x="55" y="485" width="300" height="120" class="box"/>
  <text x="205" y="535" class="label">microSD Socket</text>
  <text x="205" y="570" class="small">GPIO2–7 · SDIO / SPI mode</text>
  <path d="M355 545 H510 V500" class="line"/>

  <rect x="1045" y="90" width="300" height="120" class="box"/>
  <text x="1195" y="140" class="label">HSTX Expansion</text>
  <text x="1195" y="175" class="small">22-pin · TMDS on GPIO12–19</text>
  <path d="M890 340 H1010 V150 H1045" class="line"/>

  <rect x="1045" y="245" width="300" height="120" class="box"/>
  <text x="1195" y="295" class="label">BMI270 IMU</text>
  <text x="1195" y="330" class="small">I2C on GPIO8 / GPIO9</text>
  <path d="M890 380 H1045" class="line"/>

  <rect x="1045" y="400" width="300" height="120" class="box"/>
  <text x="1195" y="450" class="label">ICS-41350 PDM</text>
  <text x="1195" y="485" class="small">CLK GPIO10 · DATA GPIO11</text>
  <path d="M890 455 H1045" class="line"/>

  <rect x="1045" y="555" width="300" height="120" class="box"/>
  <text x="1195" y="605" class="label">QWIIC I2C</text>
  <text x="1195" y="640" class="small">GPIO24 / GPIO25 · 3.3 V</text>
  <path d="M890 500 H985 V615 H1045" class="line"/>

  <rect x="55" y="680" width="300" height="120" class="box"/>
  <text x="205" y="730" class="label">User Interfaces</text>
  <text x="205" y="765" class="small">Edge I/O · SWD · BOOT · RESET</text>
  <path d="M355 740 H610 V540" class="line"/>

  <rect x="510" y="680" width="380" height="120" class="box"/>
  <text x="700" y="730" class="label">Visual Indicators</text>
  <text x="700" y="765" class="small">3× RGB GPIO1 · user LED GPIO20</text>
  <path d="M700 680 V540" class="line"/>

  <rect x="1045" y="735" width="300" height="120" class="power"/>
  <text x="1195" y="780" class="label">Power System</text>
  <text x="1195" y="815" class="small">USB / VIN / battery → 3.3 V</text>
  <path d="M1045 795 H930 V540 H850" class="line"/>
</svg>
